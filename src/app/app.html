<mat-toolbar class="app-toolbar">
  <span class="brand">
    <mat-icon class="brand-icon">candlestick_chart</mat-icon>
    <span class="brand-text">TradingApp <strong>Ops Console</strong></span>
  </span>

  <span class="spacer"></span>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="base-url-field">
    <mat-label>API base URL</mat-label>
    <input
      matInput
      type="url"
      spellcheck="false"
      autocomplete="off"
      [value]="apiConfig.baseUrl()"
      (change)="onBaseUrlCommit($event)"
    />
  </mat-form-field>

  <button
    matIconButton
    type="button"
    [disabled]="apiConfig.isDefault()"
    [matTooltip]="'Reset to ' + apiConfig.defaultBaseUrl"
    (click)="apiConfig.reset()"
  >
    <mat-icon>restart_alt</mat-icon>
  </button>
</mat-toolbar>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="app-nav">
  @for (link of navLinks; track link.path) {
    <a
      mat-tab-link
      [routerLink]="link.path"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      <mat-icon class="nav-icon">{{ link.icon }}</mat-icon>
      {{ link.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <main class="app-content">
    <router-outlet />
  </main>
</mat-tab-nav-panel>
